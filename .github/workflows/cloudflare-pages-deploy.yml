name: Cloudflare Pages Deploy


on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]


env:
  ARTIFACT_NAME: blog-artifact


permissions:
  contents: read


jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Pages
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: "20"
        cache: npm

    - name: Restore cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          .next/cache
        key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx', '**.md') }}
        restore-keys: |
          ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Build with Next.js
      run: npm run build

    - name: Upload artifact
      if: github.event.pull_request.head.repo.fork == false
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ env.ARTIFACT_NAME }}
        retention-days: 3
        path: ./out

    - name: Skip
      if: github.event.pull_request.head.repo.fork == true
      run: echo "Skipping build for forked PR"


  deploy:
    runs-on: ubuntu-latest
    needs: build
    name: Deploy to Cloudflare Pages
    permissions:
      contents: read
      deployments: write
      pull-requests: write # To can create a comment in PR
    steps:
    - name: Checkout
      if: github.event.pull_request.head.repo.fork == false
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Download a Build Artifact
      if: github.event.pull_request.head.repo.fork == false
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: ./out

    - name: Deploy
      id: deploy
      if: github.event.pull_request.head.repo.fork == false
      uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: pages deploy out --project-name=blog-c3 --branch ${{ github.ref_name }}
        gitHubToken: ${{ secrets.GITHUB_TOKEN }}

    - name: Add Preview Url in PR Comment
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      if: github.event_name == 'pull_request'
      with:
        header: pr-preview-url
        hide_and_recreate: true
        hide_classify: "OUTDATED"
        message: |
          ### 🚀 **Preview Url** 🚀
          [${{ steps.deploy.outputs.deployment-url }}](${{ steps.deploy.outputs.deployment-url }})

    - name: Skip
      if: github.event.pull_request.head.repo.fork == true
      run: echo "Skipping deploy for forked PR"
